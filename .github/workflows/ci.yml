name: SevaHealth AI CI & Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates-and-e2e:
    name: 9-Gate Quality Assurance & E2E Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gate 1-5 & Core Verification (Unit, Integration & E2E Workflows)
        run: |
          pytest tests/test_e2e_critical_workflows.py tests/test_security_e2e.py tests/test_performance.py tests/test_scalability.py -v --tb=short

      - name: Gate 6-9 & Comprehensive CI Quality Gates Runner
        run: |
          python scripts/ci_gates.py

      - name: End-to-End Primary Demo Journey Loop Verification
        run: |
          python scripts/test_e2e.py

      - name: Multi-Tier Population Scale Benchmark Verification
        run: |
          python scripts/benchmark_scale.py

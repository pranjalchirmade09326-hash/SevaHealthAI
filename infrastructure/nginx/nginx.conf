# ==============================================================================
# SevaHealth AI - Production NGINX Reverse Proxy Configuration
# Base Image: nginx:1.27.0-alpine (Pinned)
# Security Standards: OWASP Top 10, ABDM, DISHA Healthcare Privacy
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Request Limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Logging format with Correlation IDs
    log_format seva_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time" '
                             'cid="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log seva_combined;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:15m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # Upstream Microservice Definitions
    upstream seva_api_upstream {
        server sevahealth-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream seva_ai_upstream {
        server sevahealth-ai:8004 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream grafana_upstream {
        server grafana:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream minio_console_upstream {
        server minio:9001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Gateway Server (Port 80 HTTP / TLS Terminator)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

        # Health Probe for Container Orchestration
        location /nginx-health {
            access_log off;
            return 200 '{"status":"HEALTHY","proxy":"nginx:1.27.0-alpine"}\n';
            add_header Content-Type application/json;
        }

        # Authentication Routes (Tight Rate Limiting)
        location /api/v1/auth {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://seva_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }

        # Dedicated AI Microservice Routing
        location /api/v1/ai-service/ {
            rewrite ^/api/v1/ai-service/(.*)$ /api/v1/$1 break;
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://seva_ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Primary REST API Gateway, FHIR & Endpoints
        location /api/ {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://seva_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_read_timeout 90s;
        }

        # Swagger Docs & Redoc
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://seva_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Core System Health & Telemetry
        location ~ ^/(health|metrics) {
            proxy_pass http://seva_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Native Observability Dashboard
        location /observability {
            proxy_pass http://seva_api_upstream/observability;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Grafana Telemetry Dashboard
        location /grafana/ {
            proxy_pass http://grafana_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health Worker Web Application
        location /health-worker-app {
            proxy_pass http://seva_api_upstream/health-worker-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Clinician Copilot Web Application
        location /clinician-app {
            proxy_pass http://seva_api_upstream/clinician-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Citizen Mobile Web Gateway
        location /citizen-app {
            proxy_pass http://seva_api_upstream/citizen-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Public Health Officer Dashboard
        location /public-health-app {
            proxy_pass http://seva_api_upstream/public-health-app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Default Root Web Portal
        location / {
            proxy_pass http://seva_api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
